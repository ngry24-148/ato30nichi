  /* 青のグラデーション（上は濃く、下は写真が見えるように） */
  .tint {
    position: absolute; inset: 0;
    background:
      linear-gradient(135deg, rgba(0,190,255,.55) 0%, rgba(0,60,200,0) 45%),
      linear-gradient(180deg,
        rgba(8,52,190,.97) 0%,
        rgba(8,48,180,.86) 34%,
        rgba(6,40,160,.45) 62%,
        rgba(4,28,120,.30) 100%);
    mix-blend-mode: normal;
  }

  /* 白いしぶき */
  .splash { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  .text { position: absolute; inset: 0; }
  .shadow { text-shadow: 0 .6cqw 2.4cqw rgba(0,10,60,.45); }

  .title {
    position: absolute; left: 5.5cqw; top: 6cqw;
    white-space: nowrap; line-height: 1;
    transform: skewX(-9deg);
  }
  .title .big   { font-size: 19.5cqw; letter-spacing: -.5cqw; }
  .title .small { font-size: 12cqw; margin-left: 1cqw; }

    font-size: 13cqw; line-height: 1.1;

  }

<script>
  // 白いしぶきを右上・左下に散らす（毎回同じ配置になるよう固定シード）
  (function () {
    let s = 20261105;
    const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
    const svg = document.getElementById('splash');
    const areas = [
      { cx: 1080, cy: 120,  rx: 260, ry: 220, n: 220 },
      { cx: 160,  cy: 1440, rx: 260, ry: 200, n: 200 },
      { cx: 1150, cy: 760,  rx: 140, ry: 200, n: 60 },
    ];
    let html = '';
    areas.forEach(a => {
      for (let i = 0; i < a.n; i++) {
        const ang = rnd() * Math.PI * 2, d = Math.pow(rnd(), .7);
        const x = a.cx + Math.cos(ang) * a.rx * d;
        const y = a.cy + Math.sin(ang) * a.ry * d;
        const r = rnd() < .9 ? 0.8 + rnd() * 2.2 : 3 + rnd() * 4;
        const o = (0.45 + rnd() * 0.55) * (1 - d * 0.6);
        html += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="#fff" opacity="${o.toFixed(2)}"/>`;
      }
    });
    svg.innerHTML = html;
  })();
</script>
